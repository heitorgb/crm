    <style>
      :root {

      }

        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #070a12;
        color: #e5e7eb;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;

        max-width: 360px;
      }

        width: 96px;
        height: 96px;
        border-radius: 20px;
      }
      h1 {
        margin: 24px 0 8px;
        font-size: 20px;
        color: #f9fafb;
      }
      p {
        margin: 0 0 24px;
        font-size: 15px;
        line-height: 1.5;
        color: #9ca3af;
      }
      button {
        width: 100%;
        padding: 14px 20px;
        border: 0;
        border-radius: 12px;
        background: #22c55e;
        color: #052e16;
        font-size: 16px;
        font-weight: 600;
      }
      button:active {
        opacity: 0.85;
      }
    </style>
