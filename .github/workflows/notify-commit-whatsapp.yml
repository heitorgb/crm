name: Notificar commits no WhatsApp

on:
  push:
    branches:
      - '**'
  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: notify-commit-whatsapp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  notify:
    name: Enviar commits ao CRM
    runs-on: ubuntu-latest
    if: ${{ !github.event.deleted && (github.event_name == 'pull_request' || !endsWith(github.actor, '[bot]')) }}
    steps:
      - name: Notificar commits
        env:
          CRM_WEBHOOK_URL: ${{ secrets.CRM_WEBHOOK_URL }}
          CRM_WEBHOOK_TOKEN: ${{ secrets.CRM_WEBHOOK_TOKEN }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const { setTimeout: sleep } = require('node:timers/promises');

          const MAX_MESSAGE_LENGTH = 4096;
          const MAX_ATTEMPTS = 3;
          const REQUEST_TIMEOUT_MS = 15000;
          const RETRY_DELAYS_MS = [2000, 5000];
          const ZERO_SHA = /^0{40,64}$/;
          const VALID_SHA = /^[0-9a-f]{7,64}$/i;
          const MERGE_PULL_REQUEST = /^Merge pull request #(\d+) from ([^\s/]+)\/(\S+)/i;
          const MERGE_BRANCH =
            /^Merge (?:remote-tracking )?branch '([^']+)'(?: of [^\s]+)?(?: into ([^\s]+))?/i;
          const SQUASH_PULL_REQUEST = /\(#(\d+)\)\s*$/;
          const FATAL_CODES = new Set([
            'WEBHOOK_UNAUTHORIZED',
            'MODULE_DISABLED',
            'WEBHOOK_INTEGRATION_NOT_FOUND',
            'WEBHOOK_INTEGRATION_INACTIVE',
            'WEBHOOK_INSTANCE_UNAVAILABLE',
            'WEBHOOK_GROUP_INVALID',
          ]);

          function normalizeMultiline(value) {
            return String(value ?? '')
              .replace(/\r\n?/g, '\n')
              .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F]/g, '')
              .trim();
          }

          function normalizeSingleLine(value) {
            return normalizeMultiline(value).replace(/\s+/g, ' ').trim();
          }

          function truncateUtf16(text, maxLength) {
            let result = '';
            for (const character of text) {
              if (result.length + character.length > maxLength) {
                break;
              }
              result += character;
            }
            return result;
          }

          function formatDate(value) {
            if (!value) {
              return null;
            }
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) {
              return null;
            }
            const parts = new Intl.DateTimeFormat('pt-BR', {
              timeZone: 'America/Sao_Paulo',
              day: '2-digit',
              month: '2-digit',
              year: 'numeric',
              hour: '2-digit',
              minute: '2-digit',
              hourCycle: 'h23',
            }).formatToParts(date);
            const part = (type) => parts.find((item) => item.type === type)?.value;
            return `${part('day')}/${part('month')}/${part('year')} ${part('hour')}:${part('minute')}`;
          }

          function cleanBranchName(value) {
            return normalizeSingleLine(value)
              .replace(/^refs\/heads\//, '')
              .replace(/^(?:origin|upstream)\//, '');
          }

          function safeHttpsUrl(value) {
            const url = normalizeSingleLine(value);
            if (!url) {
              return null;
            }
            try {
              return new URL(url).protocol === 'https:' ? url : null;
            } catch {
              return null;
            }
          }

          function parseMergeInfo(title) {
            const pullRequest = title.match(MERGE_PULL_REQUEST);
            if (pullRequest) {
              return {
                kind: 'pull_request',
                number: Number(pullRequest[1]),
                source: cleanBranchName(pullRequest[3]),
                destination: null,
              };
            }

            const branch = title.match(MERGE_BRANCH);
            if (branch) {
              return {
                kind: 'branch',
                number: null,
                source: cleanBranchName(branch[1]),
                destination: branch[2] ? cleanBranchName(branch[2]) : null,
              };
            }

            return null;
          }

          function squashPullRequestNumber(title) {
            const match = title.match(SQUASH_PULL_REQUEST);
            return match ? Number(match[1]) : null;
          }

          function splitCommitMessage(value) {
            const normalized = normalizeMultiline(value);
            if (!normalized) {
              return { title: '', body: '' };
            }

            const newlineIndex = normalized.indexOf('\n');
            const title =
              newlineIndex === -1
                ? normalizeSingleLine(normalized)
                : normalizeSingleLine(normalized.slice(0, newlineIndex));
            let body = newlineIndex === -1 ? '' : normalized.slice(newlineIndex + 1);
            body = body
              .split('\n')
              .map((line) => line.replace(/[ \t]+$/g, ''))
              .join('\n')
              .replace(/\n{3,}/g, '\n\n')
              .replace(/^\n+/, '')
              .replace(/\n+$/, '');

            if (title && body) {
              const [firstLine, ...remainingLines] = body.split('\n');
              if (normalizeSingleLine(firstLine) === title) {
                body = remainingLines
                  .join('\n')
                  .replace(/^\n+/, '')
                  .replace(/\n+$/, '');
              }
            }

            return { title, body };
          }

          function formatCommitBlock(commit, index, total) {
            const lines = [];
            if (!commit.title) {
              lines.push(commit.body || 'Mensagem não informada.');
            } else {
              const headline =
                total > 1 ? `*${index + 1}. ${commit.title}*` : `*${commit.title}*`;
              lines.push(headline);
              if (commit.body) {
                lines.push(commit.body);
              }
            }

            const metadata = [];
            if (commit.shortSha) {
              metadata.push(`🔖 *Hash:* ${commit.shortSha}`);
            }
            if (commit.date) {
              metadata.push(`🕒 *Data:* ${commit.date}`);
            }
            if (total > 1 && commit.commitUrl) {
              metadata.push(`🔗 *Commit:* ${commit.commitUrl}`);
            }
            if (metadata.length > 0) {
              lines.push(metadata.join('\n'));
            }
            return lines.join('\n\n');
          }

          function buildCommitMessage(fields, commits) {
            const sections = ['📝 *NOVO COMMIT NO CRM*'];
            commits.forEach((commit, index) => {
              sections.push(formatCommitBlock(commit, index, commits.length));
            });
            sections.push(`🌿 *Branch:* ${fields.branch}`);
            if (fields.authors) {
              sections.push(
                `${commits.length > 1 ? '👤 *Autores:*' : '👤 *Autor:*'} ${fields.authors}`,
              );
            }
            if (fields.changeUrl) {
              sections.push(`🔗 *Ver alterações:*\n${fields.changeUrl}`);
            }
            return sections.join('\n\n');
          }

          function buildCommitMessageWithinLimit(fields, rawCommits) {
            const commits = rawCommits.map((commit) => ({
              ...commit,
              ...splitCommitMessage(commit.rawMessage),
            }));
            const full = buildCommitMessage(fields, commits);
            if (full.length <= MAX_MESSAGE_LENGTH) {
              return full;
            }

            const suffix = '\n\n… (mensagem truncada)';
            const templateBlocks = commits.map((commit) => ({ ...commit, body: '' }));
            const template = buildCommitMessage(fields, templateBlocks);
            if (template.length + suffix.length > MAX_MESSAGE_LENGTH) {
              return truncateUtf16(template, MAX_MESSAGE_LENGTH);
            }

            let remaining = MAX_MESSAGE_LENGTH - template.length - suffix.length;
            let truncated = false;
            const limitedBlocks = commits.map((commit) => {
              if (!commit.body || truncated) {
                return { ...commit, body: '' };
              }

              const separatorLength = 2;
              const available = remaining - separatorLength;
              if (available <= 0) {
                truncated = true;
                return { ...commit, body: '' };
              }
              if (commit.body.length <= available) {
                remaining -= commit.body.length + separatorLength;
                return commit;
              }

              const truncatedBody = truncateUtf16(commit.body, available).trimEnd();
              remaining = 0;
              truncated = true;
              return { ...commit, body: `${truncatedBody}${suffix}` };
            });

            const candidate = buildCommitMessage(fields, limitedBlocks);
            if (candidate.length <= MAX_MESSAGE_LENGTH) {
              return candidate;
            }
            return truncateUtf16(candidate, MAX_MESSAGE_LENGTH);
          }

          function renderProductionMessage(fields) {
            const sections = ['🚀 *ATUALIZAÇÃO ENVIADA PARA PRODUÇÃO*'];
            if (fields.repository) {
              sections.push(`📦 *Repositório:* ${fields.repository}`);
            }
            if (fields.source) {
              sections.push(`🌿 *Origem:* ${fields.source}`);
            }
            if (fields.destination) {
              sections.push(`🎯 *Destino:* ${fields.destination}`);
            }
            if (fields.responsible) {
              sections.push(`👤 *Responsável pelo merge:* ${fields.responsible}`);
            }
            if (fields.pullRequest) {
              sections.push(`🔀 *Pull Request:* ${fields.pullRequest}`);
            }
            if (fields.link && fields.linkLabel) {
              sections.push(`🔗 *${fields.linkLabel}:*\n${fields.link}`);
            }
            if (fields.summary) {
              sections.push(`📝 *Resumo das alterações:*\n${fields.summary}`);
            }
            return sections.join('\n\n');
          }

          function buildProductionMessageWithinLimit(fields) {
            const summary = normalizeMultiline(fields.summary);
            const full = renderProductionMessage({ ...fields, summary });
            if (full.length <= MAX_MESSAGE_LENGTH) {
              return full;
            }

            const suffix = '\n\n… (mensagem truncada)';
            const template = renderProductionMessage({ ...fields, summary: '' });
            if (template.length + suffix.length > MAX_MESSAGE_LENGTH) {
              return truncateUtf16(template, MAX_MESSAGE_LENGTH);
            }

            const summaryPrefix = '\n\n📝 *Resumo das alterações:*\n';
            const available =
              MAX_MESSAGE_LENGTH - template.length - summaryPrefix.length - suffix.length;
            if (available <= 0) {
              return truncateUtf16(template, MAX_MESSAGE_LENGTH);
            }

            const truncatedSummary = truncateUtf16(summary, available).trimEnd();
            const candidate = renderProductionMessage({
              ...fields,
              summary: `${truncatedSummary}${suffix}`,
            });
            if (candidate.length <= MAX_MESSAGE_LENGTH) {
              return candidate;
            }
            return truncateUtf16(candidate, MAX_MESSAGE_LENGTH);
          }

          function requireWebhookConfig() {
            const url = process.env.CRM_WEBHOOK_URL?.trim();
            const token = process.env.CRM_WEBHOOK_TOKEN?.trim();
            if (!url || !token) {
              throw new Error(
                'Cadastre os secrets CRM_WEBHOOK_URL e CRM_WEBHOOK_TOKEN no repositório.',
              );
            }
            let parsed;
            try {
              parsed = new URL(url);
            } catch {
              throw new Error('CRM_WEBHOOK_URL não contém uma URL válida.');
            }
            if (parsed.protocol !== 'https:') {
              throw new Error('CRM_WEBHOOK_URL deve usar HTTPS.');
            }
            return { url, token };
          }

          function idempotencyKeyFor(repository, branch, reference) {
            const digest = crypto
              .createHash('sha256')
              .update(`${repository}\n${branch}\n${reference}`)
              .digest('hex');
            return `github-crm-push:${digest}`;
          }

          function productionIdempotencyKeyFor(repository, destination, reference) {
            const digest = crypto
              .createHash('sha256')
              .update(`${repository}\n${destination}\n${reference}`)
              .digest('hex');
            return `github-crm-production:${digest}`;
          }

          function parseRetryAfter(response) {
            const value = response.headers.get('retry-after');
            if (!value) {
              return null;
            }
            const seconds = Number(value);
            if (Number.isFinite(seconds) && seconds >= 0) {
              return Math.min(seconds * 1000, 30000);
            }
            const date = Date.parse(value);
            if (!Number.isNaN(date)) {
              return Math.min(Math.max(date - Date.now(), 0), 30000);
            }
            return null;
          }

          async function sendOnce(url, token, payload, idempotencyKey) {
            const response = await fetch(url, {
              method: 'POST',
              headers: {
                Authorization: `Bearer ${token}`,
                'Content-Type': 'application/json',
                Accept: 'application/json',
                'Idempotency-Key': idempotencyKey,
              },
              body: JSON.stringify(payload),
              signal: AbortSignal.timeout(REQUEST_TIMEOUT_MS),
            });
            const text = await response.text();
            let data = null;
            if (text) {
              try {
                data = JSON.parse(text);
              } catch {
                data = null;
              }
            }
            return {
              status: response.status,
              data,
              retryAfterMs: parseRetryAfter(response),
            };
          }

          function isRetryable(status, code) {
            if (status === 408 || status === 429) {
              return true;
            }
            if (status === 409 && code === 'WEBHOOK_EXECUTION_IN_PROGRESS') {
              return true;
            }
            if (status >= 500 && status <= 599) {
              return code !== 'WEBHOOK_EXECUTION_FAILED';
            }
            return false;
          }

          function describeFailure(result) {
            if (!result.status) {
              return result.message ?? 'falha de rede';
            }
            const code = result.code ? ` ${result.code}` : '';
            const message = result.message ? ` - ${truncateUtf16(result.message, 300)}` : '';
            return `HTTP ${result.status}${code}${message}`;
          }

          async function sendWithRetry(url, token, payload, idempotencyKey) {
            let last = {
              ok: false,
              status: 0,
              code: null,
              message: 'falha de rede',
              fatal: false,
            };

            for (let attempt = 1; attempt <= MAX_ATTEMPTS; attempt += 1) {
              try {
                const response = await sendOnce(url, token, payload, idempotencyKey);
                const code = typeof response.data?.code === 'string' ? response.data.code : null;
                const message =
                  typeof response.data?.message === 'string' ? response.data.message : null;

                if (response.status >= 200 && response.status < 300) {
                  return { ok: true, status: response.status, code, message, fatal: false };
                }

                last = {
                  ok: false,
                  status: response.status,
                  code,
                  message,
                  fatal:
                    FATAL_CODES.has(code) ||
                    response.status === 401 ||
                    response.status === 403 ||
                    response.status === 404,
                };

                if (attempt >= MAX_ATTEMPTS || !isRetryable(response.status, code)) {
                  return last;
                }

                const delay =
                  response.retryAfterMs ?? RETRY_DELAYS_MS[attempt - 1] ?? RETRY_DELAYS_MS.at(-1);
                console.log(
                  `Tentativa ${attempt}/${MAX_ATTEMPTS} falhou (HTTP ${response.status}${code ? ` ${code}` : ''}); nova tentativa em ${Math.round(delay / 1000)}s.`,
                );
                await sleep(delay);
              } catch (error) {
                const timedOut =
                  error?.name === 'TimeoutError' || error?.name === 'AbortError';
                last = {
                  ok: false,
                  status: 0,
                  code: null,
                  message: timedOut ? 'timeout na requisição' : 'falha de rede',
                  fatal: false,
                };

                if (attempt >= MAX_ATTEMPTS) {
                  return last;
                }

                const delay = RETRY_DELAYS_MS[attempt - 1] ?? RETRY_DELAYS_MS.at(-1);
                console.log(
                  `Tentativa ${attempt}/${MAX_ATTEMPTS} falhou (${last.message}); nova tentativa em ${Math.round(delay / 1000)}s.`,
                );
                await sleep(delay);
              }
            }

            return last;
          }

          async function handlePullRequest(event) {
            const action = normalizeSingleLine(event.action);
            const pullRequest = event.pull_request ?? {};

            if (action !== 'closed' || pullRequest.merged !== true) {
              console.log('Pull Request não integrado; nada a notificar.');
              return;
            }

            const repository = normalizeSingleLine(event.repository?.full_name);
            const destination = cleanBranchName(pullRequest.base?.ref);
            if (!repository || destination.toLowerCase() !== 'main') {
              console.log('Pull Request sem integração identificável em main; nada a notificar.');
              return;
            }

            const number = Number.isInteger(pullRequest.number) ? pullRequest.number : null;
            const mergeSha = normalizeSingleLine(pullRequest.merge_commit_sha);
            if (!number && !VALID_SHA.test(mergeSha)) {
              console.error('Pull Request integrado sem número ou commit de merge; nada a notificar.');
              return;
            }

            const source = cleanBranchName(pullRequest.head?.ref || pullRequest.head?.label);
            const responsible = normalizeSingleLine(
              pullRequest.merged_by?.login ||
                pullRequest.merged_by?.name ||
                event.sender?.login ||
                pullRequest.user?.login,
            );
            const pullRequestTitle = normalizeSingleLine(pullRequest.title);
            const pullRequestLabel = number
              ? `#${number}${pullRequestTitle ? ` — ${pullRequestTitle}` : ''}`
              : pullRequestTitle || null;
            const pullRequestUrl = safeHttpsUrl(pullRequest.html_url);
            const mergeCommitUrl = VALID_SHA.test(mergeSha)
              ? `https://github.com/${repository}/commit/${mergeSha}`
              : null;
            const link = pullRequestUrl || mergeCommitUrl;
            const fields = {
              repository: truncateUtf16(repository, 140),
              source: source ? truncateUtf16(source, 200) : null,
              destination: truncateUtf16(destination, 50),
              responsible: responsible ? truncateUtf16(responsible, 150) : null,
              pullRequest: pullRequestLabel ? truncateUtf16(pullRequestLabel, 300) : null,
              link,
              linkLabel: link ? (pullRequestUrl ? 'Ver Pull Request' : 'Ver commit de merge') : null,
              summary: pullRequest.body,
            };
            const message = buildProductionMessageWithinLimit(fields);
            const reference = VALID_SHA.test(mergeSha)
              ? mergeSha
              : `pull-request-${number}`;
            const idempotencyKey = productionIdempotencyKeyFor(
              repository,
              destination,
              reference,
            );
            const { url, token } = requireWebhookConfig();

            console.log(
              `Notificando integração do Pull Request ${number ? `#${number}` : reference} em ${destination}...`,
            );
            const result = await sendWithRetry(url, token, { message }, idempotencyKey);

            if (result.ok) {
              console.log(`Integração em ${destination} notificada com sucesso (HTTP ${result.status}).`);
              return;
            }

            console.error(`Falha ao notificar a integração em ${destination}: ${describeFailure(result)}`);
            if (result.fatal) {
              console.error('Erro de configuração ou integração do webhook; interrompendo.');
            }
            process.exitCode = 1;
          }

          async function handlePush(event) {
            const repository = normalizeSingleLine(event.repository?.full_name);
            const branch = cleanBranchName(event.ref);
            const before = normalizeSingleLine(event.before);
            const after = normalizeSingleLine(event.after);
            const commits = Array.isArray(event.commits) ? event.commits : [];

            if (event.deleted === true) {
              console.log('Push de exclusão de branch ignorado.');
              return;
            }
            if (!repository || !branch) {
              console.error('Push sem repositório ou branch identificável; nada a notificar.');
              return;
            }
            if (commits.length === 0) {
              console.log('Push sem commits novos; nada a notificar.');
              return;
            }
            if (ZERO_SHA.test(before) || ZERO_SHA.test(after)) {
              console.log('Criação ou exclusão de referência ignorada.');
              return;
            }

            const isMain = branch.toLowerCase() === 'main';
            const pusher = normalizeSingleLine(event.pusher?.name);
            const notSent = [];
            const normalCommits = [];
            const productionMerges = [];

            for (let index = 0; index < commits.length; index += 1) {
              const commit = commits[index] ?? {};
              const sha = normalizeSingleLine(commit.id);
              const position = `[${index + 1}/${commits.length}]`;

              if (commit.distinct === false) {
                console.log(`${position} Commit já conhecido no push; ignorado.`);
                continue;
              }
              if (!VALID_SHA.test(sha)) {
                console.error(`${position} Commit sem hash válido; ignorado.`);
                notSent.push(`#${index + 1}`);
                continue;
              }

              const { title } = splitCommitMessage(commit.message);
              const merge = parseMergeInfo(title);
              const squashNumber = merge ? null : squashPullRequestNumber(title);
              const author = normalizeSingleLine(commit.author?.name) || 'Não informado';
              const commitData = {
                sha,
                rawMessage: commit.message,
                author,
                shortSha: sha.slice(0, 7),
                date: formatDate(commit.timestamp ?? commit.author?.date),
                commitUrl: `https://github.com/${repository}/commit/${sha}`,
              };

              if (
                isMain &&
                merge?.kind === 'branch' &&
                merge.source &&
                merge.source.toLowerCase() !== 'main' &&
                (!merge.destination || merge.destination.toLowerCase() === 'main')
              ) {
                const responsible = author !== 'Não informado' ? author : pusher;
                productionMerges.push({
                  ...commitData,
                  source: merge.source,
                  destination: merge.destination || 'main',
                  responsible,
                });
                console.log(
                  `${position} Merge de ${merge.source} em ${branch} identificado; notificação de produção separada.`,
                );
                continue;
              }

              if (merge?.kind === 'pull_request') {
                console.log(
                  `${position} Merge automático do Pull Request #${merge.number} ignorado como commit comum; a notificação de produção é gerada pelo evento pull_request.`,
                );
                continue;
              }

              if (isMain && squashNumber) {
                console.log(
                  `${position} Commit de squash do Pull Request #${squashNumber} ignorado como commit comum; a notificação de produção é gerada pelo evento pull_request.`,
                );
                continue;
              }

              if (merge) {
                console.log(`${position} Commit automático de merge ignorado como commit comum.`);
                continue;
              }

              normalCommits.push(commitData);
            }

            if (normalCommits.length === 0 && productionMerges.length === 0) {
              console.log('Nenhum commit novo válido para notificar.');
              if (notSent.length > 0) {
                console.error(`${notSent.length} commit(s) não notificado(s): ${notSent.join(', ')}`);
                process.exitCode = 1;
              }
              return;
            }

            const { url, token } = requireWebhookConfig();
            const summary = normalCommits
              .map((commit) => splitCommitMessage(commit.rawMessage).title)
              .filter(Boolean)
              .join('\n');

            for (const merge of productionMerges) {
              const fields = {
                repository: truncateUtf16(repository, 140),
                source: truncateUtf16(merge.source, 200),
                destination: truncateUtf16(merge.destination, 50),
                responsible: merge.responsible
                  ? truncateUtf16(merge.responsible, 150)
                  : null,
                pullRequest: null,
                link: merge.commitUrl,
                linkLabel: 'Ver commit de merge',
                summary,
              };
              const message = buildProductionMessageWithinLimit(fields);
              const idempotencyKey = productionIdempotencyKeyFor(
                repository,
                merge.destination,
                merge.sha,
              );

              console.log(
                `Notificando merge de ${merge.source} em ${merge.destination} (${merge.shortSha})...`,
              );
              const result = await sendWithRetry(url, token, { message }, idempotencyKey);

              if (result.ok) {
                console.log(
                  `Merge de ${merge.source} em ${merge.destination} notificado com sucesso (HTTP ${result.status}).`,
                );
              } else {
                notSent.push(merge.sha);
                console.error(
                  `Falha ao notificar o merge de ${merge.source} em ${merge.destination}: ${describeFailure(result)}`,
                );
                if (result.fatal) {
                  console.error('Erro de configuração ou integração do webhook; interrompendo.');
                }
              }
            }

            if (normalCommits.length > 0) {
              const authors = [...new Set(normalCommits.map((commit) => commit.author))];
              const compareUrl =
                normalCommits.length > 1 && VALID_SHA.test(before) && VALID_SHA.test(after)
                  ? `https://github.com/${repository}/compare/${before}...${after}`
                  : normalCommits[normalCommits.length - 1].commitUrl;
              const fields = {
                branch: truncateUtf16(branch, 200),
                authors: truncateUtf16(authors.join(', '), 200),
                changeUrl: compareUrl,
              };
              const message = buildCommitMessageWithinLimit(fields, normalCommits);
              const idempotencyKey = idempotencyKeyFor(
                repository,
                branch,
                normalCommits.map((commit) => commit.sha).join(','),
              );

              console.log(
                `Notificando ${normalCommits.length} commit(s) em ${fields.branch}...`,
              );
              const result = await sendWithRetry(url, token, { message }, idempotencyKey);

              if (result.ok) {
                console.log(
                  `${normalCommits.length} commit(s) notificado(s) com sucesso (HTTP ${result.status}).`,
                );
              } else {
                notSent.push(...normalCommits.map((commit) => commit.sha));
                console.error(`Falha ao notificar o push: ${describeFailure(result)}`);
                if (result.fatal) {
                  console.error('Erro de configuração ou integração do webhook; interrompendo.');
                }
              }
            }

            if (notSent.length > 0) {
              console.error(`${notSent.length} commit(s) não notificado(s): ${notSent.join(', ')}`);
              process.exitCode = 1;
            }
          }

          async function main() {
            if (!process.env.GITHUB_EVENT_PATH) {
              throw new Error('GITHUB_EVENT_PATH não foi informado.');
            }

            const event = JSON.parse(
              fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'),
            );
            const eventName = normalizeSingleLine(process.env.GITHUB_EVENT_NAME) || 'push';

            if (eventName === 'pull_request') {
              await handlePullRequest(event);
              return;
            }
            if (eventName !== 'push') {
              console.log(`Evento ${eventName} ignorado.`);
              return;
            }

            await handlePush(event);
          }

          main().catch((error) => {
            console.error(error instanceof Error ? error.message : 'Erro desconhecido.');
            process.exitCode = 1;
          });
          NODE
