    <title>OrderUp CRM | Atendimento, CRM e operação em uma só plataforma</title>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('orderup-theme');
          var stored = null;
          if (raw) {
            try {
              stored = JSON.parse(raw).state.theme;
            } catch (parseError) {
              stored = raw;
            }
          }
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = stored === 'dark' || (stored !== 'light' && systemDark);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.classList.toggle('light', !dark);
        } catch (e) {
          /* noop */
        }
      })();
    </script>
